name: Install Mission Control finance review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-immediate-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add finance review script to shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          s = path.read_text()
          tag = '<script src="./finance-review.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html has no closing body tag')
              s = s.replace('</body>', tag + '\n</body>', 1)
              path.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Finance review script already installed"
            exit 0
          fi
          git config user.name "Mission Control Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Enable interactive finance transaction review"
          git push
