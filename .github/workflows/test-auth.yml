name: Auth Contract Tests

on:
  push:
    branches: [main]
    paths:
      - "auth/**"
      - "api/v1/**"
      - "package.json"
      - ".github/workflows/test-auth.yml"
  pull_request:
    paths:
      - "auth/**"
      - "api/v1/**"
      - "package.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run test:auth
