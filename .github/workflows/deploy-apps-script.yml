name: Deploy Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "google_apps_script_Code.gs"
      - ".github/workflows/deploy-apps-script.yml"

permissions:
  contents: read

concurrency:
  group: mission-control-apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Configure clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Stage Apps Script source
        run: |
          mkdir -p apps-script-dist
          cp google_apps_script_Code.gs apps-script-dist/Code.gs
          cat > apps-script-dist/appsscript.json <<'EOF'
          {
            "timeZone": "America/Chicago",
            "exceptionLogging": "STACKDRIVER",
            "runtimeVersion": "V8"
          }
          EOF

      - name: Push source
        run: clasp push --force

      - name: Create immutable version
        id: version
        run: |
          OUTPUT="$(clasp create-version "GitHub Actions ${GITHUB_SHA}")"
          echo "$OUTPUT"
          VERSION="$(printf '%s' "$OUTPUT" | grep -Eo '[0-9]+' | tail -1)"
          test -n "$VERSION"
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Preserve Web App deployment
        run: |
          echo "Source pushed and immutable version ${{ steps.version.outputs.number }} created."
          echo "Production Web App deployment is intentionally NOT mutated by clasp until a WebAppConfig-preserving deployer is commissioned."
