name: Deploy Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "google_apps_script_Code.gs"
      - ".github/workflows/deploy-apps-script.yml"
      - "scripts/stage-apps-script.mjs"

permissions:
  contents: read

concurrency:
  group: mission-control-apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release source
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          test "$RELEASE_REF" = "refs/heads/main"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$MAIN_SHA"
          test "$GITHUB_SHA" = "$MAIN_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Configure clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          node -e 'try { const value = JSON.parse(process.env.CLASPRC_JSON); if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error(); } catch { console.error("CLASPRC_JSON must contain a JSON object; credential contents omitted."); process.exit(1); }'
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Stage Apps Script source
        run: |
          mkdir -p apps-script-dist
          node scripts/stage-apps-script.mjs
          cat > apps-script-dist/appsscript.json <<'EOF'
          {
            "timeZone": "America/Chicago",
            "exceptionLogging": "STACKDRIVER",
            "runtimeVersion": "V8"
          }
          EOF

      - name: Push source
        run: clasp push --force

      - name: Create immutable version
        id: version
        run: |
          OUTPUT="$(clasp create-version "GitHub Actions ${GITHUB_SHA}")"
          echo "$OUTPUT"
          VERSION="$(printf '%s' "$OUTPUT" | grep -Eo '[0-9]+' | tail -1)"
          test -n "$VERSION"
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Preserve Web App deployment
        env:
          APPS_SCRIPT_VERSION: ${{ steps.version.outputs.number }}
        run: |
          echo "Source pushed and immutable version $APPS_SCRIPT_VERSION created."
          echo "Production Web App deployment is intentionally NOT mutated by clasp until a WebAppConfig-preserving deployer is commissioned."
          echo "::notice title=Apps Script release candidate::Immutable version $APPS_SCRIPT_VERSION; source $GITHUB_SHA; production promotion pending."
          {
            echo "## Apps Script release candidate"
            echo "Source SHA: $GITHUB_SHA"
            echo "Immutable version: $APPS_SCRIPT_VERSION"
            echo "Production Web App promotion: pending manual selection on the existing deployment."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner credential
        if: always()
        run: rm -f "$HOME/.clasprc.json"
