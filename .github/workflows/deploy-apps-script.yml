name: Deploy Apps Script

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-control-apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Configure clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json

      - name: Stage Apps Script source
        run: |
          mkdir -p apps-script-dist
          cp google_apps_script_Code.gs apps-script-dist/Code.gs
          cat > apps-script-dist/appsscript.json <<'EOF'
          {
            "timeZone": "America/Chicago",
            "exceptionLogging": "STACKDRIVER",
            "runtimeVersion": "V8"
          }
          EOF
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('.clasp.json','utf8'));x.rootDir='apps-script-dist';fs.writeFileSync('.clasp.json',JSON.stringify(x,null,2));"

      - name: Push source
        run: clasp push --force

      - name: Create immutable version
        id: version
        run: |
          OUTPUT="$(clasp create-version "GitHub Actions ${GITHUB_SHA}")"
          echo "$OUTPUT"
          VERSION="$(printf '%s' "$OUTPUT" | grep -Eo '[0-9]+' | tail -1)"
          test -n "$VERSION"
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update production deployment
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          test -n "$APPS_SCRIPT_DEPLOYMENT_ID"
          clasp create-deployment --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" --versionNumber "${{ steps.version.outputs.number }}" --description "GitHub ${GITHUB_SHA}"
