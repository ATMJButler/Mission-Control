<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Calendar preview — Mission Control</title>
<style>body{font:16px system-ui;margin:0;background:#f4f6fa;color:#17243a}main{max-width:760px;margin:auto;padding:24px}h1{font-size:2rem}.notice{background:#fff3ce;padding:16px;border-radius:12px}button,select{font:inherit;padding:12px;border-radius:8px;border:1px solid #8896a8;margin:8px 8px 8px 0}button{background:#17243a;color:white}.events{list-style:none;padding:0}.events li{background:white;padding:18px;margin:12px 0;border-radius:12px}.events h2{font-size:1.15rem;margin:0}.conflict{color:#993800;font-weight:600}small{color:#526176}</style></head>
<body><main><h1>Family Calendar</h1><p class="notice"><strong>Design preview.</strong> No household data is loaded. Calendar and email connections are not active here.</p><p>One place for shared commitments, with private details kept private.</p><button id="sample" type="button">Show sample events</button><button id="clear" type="button">Clear sample events</button><label for="zone">Display timezone</label><select id="zone"><option value="America/Chicago">Central</option><option value="America/New_York">Eastern</option><option value="America/Denver">Mountain</option><option value="America/Los_Angeles">Pacific</option></select><p id="status" role="status">No sample events shown.</p><section id="calendar" aria-label="Family events"></section></main>
<script type="module">
import {renderFamilyCalendar} from './family/calendar-view.js';
let calendar={events:[],conflicts:[]};
const root=document.getElementById('calendar'),zone=document.getElementById('zone'),status=document.getElementById('status');
const render=()=>renderFamilyCalendar(root,calendar,{timeZone:zone.value});
document.getElementById('sample').onclick=()=>{calendar={events:[{id:'sample-pickup',title:'Sample: school pickup',start:'2026-10-05T20:00:00Z',end:'2026-10-05T20:30:00Z',allDay:false,sourceLabel:'Sample family calendar'},{id:'sample-busy',title:'Busy',start:'2026-10-05T20:15:00Z',end:'2026-10-05T21:00:00Z',allDay:false,sourceLabel:'Private calendar'},{id:'sample-trip',title:'Sample: family trip',start:'2026-10-10',end:'2026-10-12',allDay:true,sourceLabel:'Sample family calendar'}],conflicts:[{eventIds:['sample-pickup','sample-busy']}]};status.textContent='Showing sample events only.';render();};
document.getElementById('clear').onclick=()=>{calendar={events:[],conflicts:[]};status.textContent='No sample events shown.';render();};zone.onchange=render;render();
</script></body></html>
