<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Control — Invite Member</title><link rel="stylesheet" href="/auth-ui.css"><style>body{margin:0;background:#07111f;color:#edf4fa;font-family:Inter,system-ui,sans-serif}.wrap{max-width:620px;margin:8vh auto;padding:24px}.card{background:#0d1a2c;border:1px solid #315174;border-radius:20px;padding:24px}button,input,select{font:inherit;padding:12px;border-radius:10px}button{cursor:pointer}.token{word-break:break-all;background:#07111f;padding:12px;border-radius:10px;margin-top:14px}.muted{color:#9eb0c5}</style><script src="/auth-ui.js" defer></script></head><body><div id="mcAuthGate"><div class="mc-auth-card"><h1>Mission Control</h1><p>Sign in to manage household access.</p><div id="mcClerkMount"></div><div class="mc-auth-state" id="mcAuthState">Loading secure sign-in…</div></div></div><div class="wrap"><div class="card"><h1>Invite household member</h1><p class="muted">Creates a single-use code valid for 24 hours. The member signs in first, then enters this code.</p><select id="role"><option value="secondary">Secondary</option><option value="extended">Extended</option></select> <button id="create">Create invite</button><div id="out"></div></div></div><script>document.getElementById("create").onclick=async()=>{const out=document.getElementById("out");out.textContent="Creating…";const r=await fetch("/api/v1/create-invitation",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({householdId:"butler-household",role:document.getElementById("role").value})}),b=await r.json();if(!r.ok){out.textContent=b.error||"Invite failed";return}out.innerHTML='<p>Invite created. Copy this code directly to the member. Do not post it publicly.</p><div class="token" id="code"></div><button id="copy">Copy code</button>';document.getElementById("code").textContent=b.inviteToken;document.getElementById("copy").onclick=()=>navigator.clipboard.writeText(b.inviteToken)};</script></body></html>
