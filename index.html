<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Mission Control</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
html,body{width:100%;height:100%;margin:0;background:#07111f;overflow:hidden}#core{display:block;width:100%;height:100%;border:0;background:#07111f}
</style>
</head>
<body>
<iframe id="core" src="./app-v5.html" title="Mission Control"></iframe>
<script>
const frame=document.getElementById('core');
const BUDGET_URL='https://docs.google.com/spreadsheets/d/1i35k09HfZ3CEkj9PVoMh8pF7xPI2g2hX2FBsMsbo3Q4/edit';
const REVIEW_URL='https://docs.google.com/spreadsheets/d/1i35k09HfZ3CEkj9PVoMh8pF7xPI2g2hX2FBsMsbo3Q4/edit?gid=151895354#gid=151895354';
let lastFinanceStamp='';

const FIN_CSS=`
.fin-hero{background:linear-gradient(180deg,rgba(18,43,57,.98),rgba(10,26,38,.98));border-color:#315c6d}
.fin-actions{display:flex;gap:8px;flex-wrap:wrap}.fin-actions a{text-decoration:none}
.fin-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}.fin-kpi{background:#091925;border:1px solid #285267;border-radius:14px;padding:12px}.fin-kpi .n{font-size:26px;font-weight:900;letter-spacing:-.03em}.fin-kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:3px}.fin-kpi .d{font-size:11px;color:#c7d3e1;margin-top:3px}.fin-kpi.bad .n{color:var(--bad)}.fin-kpi.good .n{color:var(--good)}.fin-kpi.warn .n{color:var(--warn)}
.fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.fin-wide{grid-column:1/-1}.fin-chart{display:flex;flex-direction:column;gap:8px}.fin-row{display:grid;grid-template-columns:62px 1fr 92px;gap:8px;align-items:center}.fin-month{font-size:11px;color:#c8d5e2}.fin-bars{display:grid;gap:3px}.fin-bar{height:8px;border-radius:999px;min-width:2px}.fin-bar.spend{background:#7fc8ff}.fin-bar.budget{background:#556b84}.fin-bar.income{background:#62d89a}.fin-val{text-align:right;font-size:11px;color:#dbe6f0}.fin-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-bottom:8px}.fin-dot{display:inline-block;width:9px;height:9px;border-radius:999px;margin-right:4px}.fin-dot.spend{background:#7fc8ff}.fin-dot.budget{background:#556b84}.fin-dot.income{background:#62d89a}
.fin-margin-track{height:12px;background:#08121f;border:1px solid #1f3650;border-radius:999px;position:relative;overflow:hidden}.fin-margin-track:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#5b6b7c}.fin-margin{position:absolute;top:1px;bottom:1px;border-radius:999px}.fin-margin.pos{left:50%;background:var(--good)}.fin-margin.neg{right:50%;background:var(--bad)}
.fin-pressure{display:flex;flex-direction:column;gap:7px}.fin-pressure-row{display:grid;grid-template-columns:minmax(150px,1fr) 90px;gap:9px;align-items:center;background:#091525;border:1px solid #203550;border-radius:10px;padding:9px}.fin-pressure-row b{font-size:12px}.fin-pressure-row .v{text-align:right;color:var(--bad);font-size:11px;font-weight:850}.fin-meter{grid-column:1/-1;height:6px;background:#07111e;border-radius:999px;overflow:hidden}.fin-meter span{display:block;height:100%;background:var(--bad);border-radius:999px}
.fin-debt-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:9px}.fin-debt-stat{background:#091525;border:1px solid #29425f;border-radius:11px;padding:10px}.fin-debt-stat b{display:block;font-size:20px}.fin-debt-stat span{font-size:10px;color:var(--muted)}.fin-debt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.fin-debt-card{background:#091525;border:1px solid #29425f;border-radius:12px;padding:11px}.fin-debt-card.missing{border-color:#6b5730;background:#211b10}.fin-debt-card h4{margin:0 0 3px}.fin-balance{font-size:22px;font-weight:900;margin:5px 0}.fin-debt-meta{font-size:11px;line-height:1.55;color:#c9d6e2}.fin-status{font-size:10px;color:var(--muted);margin-top:6px}
.fin-review{display:grid;grid-template-columns:92px minmax(130px,1fr) 90px 120px minmax(160px,1fr);gap:8px;align-items:center;background:#091525;border:1px solid #203550;border-radius:10px;padding:9px;font-size:11px}.fin-review .reason{color:var(--warn)}.fin-source{font-size:10px;color:var(--muted);line-height:1.5}.fin-lock{background:#281f10;border:1px solid #69562b;border-radius:12px;padding:13px;color:#f7dca0}
@media(max-width:1100px){.fin-kpis{grid-template-columns:repeat(2,1fr)}.fin-grid{grid-template-columns:1fr}.fin-wide{grid-column:auto}.fin-debt-grid{grid-template-columns:1fr}.fin-review{grid-template-columns:86px 1fr 90px}.fin-review .cat,.fin-review .reason{grid-column:2/-1}}
@media(max-width:620px){.fin-kpis{grid-template-columns:1fr 1fr}.fin-row{grid-template-columns:52px 1fr 75px}.fin-debt-summary{grid-template-columns:1fr}.fin-review{grid-template-columns:76px 1fr}.fin-review .amount{text-align:right}.fin-review .cat,.fin-review .reason{grid-column:1/-1}}
`;

const FIN_HTML=`
<section class="page" id="page-finances">
  <div class="hero fin-hero">
    <div class="hero-top"><div><h2>Household Finances</h2><div class="hero-sub">Budget control, cash flow, debt, and the numbers that deserve attention.</div></div><div class="fin-actions"><button class="btn" id="finRefresh">Refresh</button><a class="btn" href="${BUDGET_URL}" target="_blank" rel="noopener">Open Full Budget</a><a class="btn" href="${REVIEW_URL}" target="_blank" rel="noopener">Review Transactions</a></div></div>
    <div class="hint" id="finAsOf" style="margin-top:8px">Waiting for private Mission Control sync…</div><div class="fin-kpis" id="finKpis"></div>
  </div>
  <div class="fin-grid">
    <div class="panel"><h3>Monthly spending vs working budget</h3><div class="fin-legend"><span><i class="fin-dot spend"></i>Spending</span><span><i class="fin-dot budget"></i>Budget</span></div><div class="fin-chart" id="finSpend"></div></div>
    <div class="panel"><h3>Confirmed income vs spending</h3><div class="fin-legend"><span><i class="fin-dot income"></i>Income</span><span><i class="fin-dot spend"></i>Spending</span></div><div class="fin-chart" id="finIncome"></div></div>
    <div class="panel fin-wide"><h3>Household margin by month</h3><div class="fin-chart" id="finMargin"></div></div>
    <div class="panel"><h3>Category pressure</h3><div class="hint">Worst variance to plan through today first.</div><div class="fin-pressure" id="finPressure" style="margin-top:9px"></div></div>
    <div class="panel"><h3>Debt command center</h3><div id="finDebt"></div></div>
    <div class="panel fin-wide"><h3>Needs attention</h3><div class="hint">Recent transactions that still need a clean category or transfer explanation.</div><div class="list" id="finReview" style="margin-top:9px"></div></div>
    <div class="panel fin-wide"><div class="fin-source" id="finSource"></div></div>
  </div>
</section>`;

function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){if(v===null||v===undefined||Number.isNaN(Number(v)))return 'Unknown';return new Intl.NumberFormat(undefined,{style:'currency',currency:'USD',maximumFractionDigits:2}).format(Number(v))}
function signed(v){const n=Number(v||0);return (n>0?'+':'')+money(n)}
function dateLabel(v){if(!v)return 'Unknown';return new Date(v+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function monthLabel(v){const p=String(v).split('-');return new Date(Number(p[0]),Number(p[1])-1,2).toLocaleDateString(undefined,{month:'short'})}
function doc(){return frame.contentDocument}function win(){return frame.contentWindow}

function installBridge(){
  const d=doc();if(!d||!d.querySelector('.nav'))return false;
  if(!d.getElementById('finInjectedStyle')){const st=d.createElement('style');st.id='finInjectedStyle';st.textContent=FIN_CSS;d.head.appendChild(st)}
  if(!d.getElementById('page-finances')){const dataPage=d.getElementById('page-data');dataPage.insertAdjacentHTML('beforebegin',FIN_HTML)}
  if(!d.querySelector('.nav [data-page="finances"]')){const b=d.createElement('button');b.dataset.page='finances';b.textContent='Finances';const dataBtn=d.querySelector('.nav [data-page="data"]');dataBtn.parentNode.insertBefore(b,dataBtn);b.onclick=()=>{win().switchPage('finances');renderFinance();}}
  if(!win().__mcFinanceSnapshot){const sc=d.createElement('script');sc.textContent=`window.__mcFinanceSnapshot=function(){try{const p=state.projects.find(x=>x&&x.financeData);return p&&p.financeData?JSON.parse(p.financeData):null}catch(e){return null}};window.__mcFinancePull=async function(){try{await pullProjects(false);return true}catch(e){return false}};`;d.body.appendChild(sc)}
  const refresh=d.getElementById('finRefresh');if(refresh&&!refresh.dataset.bound){refresh.dataset.bound='1';refresh.onclick=async()=>{refresh.textContent='Refreshing…';if(win().__mcFinancePull)await win().__mcFinancePull();setTimeout(()=>{renderFinance(true);refresh.textContent='Refresh'},350)}}
  return true
}

function renderBars(el,rows,a,b){const max=Math.max(1,...rows.flatMap(r=>[Number(r[a])||0,Number(r[b])||0]));el.innerHTML=rows.map(r=>`<div class="fin-row"><div class="fin-month">${monthLabel(r.month)}</div><div class="fin-bars"><div class="fin-bar ${a==='confirmedIncome'?'income':'spend'}" style="width:${Math.max(1,(Number(r[a])||0)/max*100)}%"></div><div class="fin-bar ${b==='budget'?'budget':'spend'}" style="width:${Math.max(1,(Number(r[b])||0)/max*100)}%"></div></div><div class="fin-val">${money(r[a])}</div></div>`).join('')}
function renderMargins(el,rows){const max=Math.max(1,...rows.map(r=>Math.abs(Number(r.margin)||0)));el.innerHTML=rows.map(r=>{const n=Number(r.margin)||0,w=Math.min(50,Math.abs(n)/max*50);return `<div class="fin-row"><div class="fin-month">${monthLabel(r.month)}</div><div class="fin-margin-track"><span class="fin-margin ${n>=0?'pos':'neg'}" style="width:${w}%"></span></div><div class="fin-val" style="color:${n>=0?'var(--good)':'var(--bad)'}">${signed(n)}</div></div>`}).join('')}

function renderFinance(showToast=false){
  if(!installBridge())return;
  const d=doc(),snap=win().__mcFinanceSnapshot?win().__mcFinanceSnapshot():null;
  if(!snap){d.getElementById('finAsOf').textContent='Private finance data has not reached this device yet. Use Data & Sync to confirm this device is connected, then press Refresh.';d.getElementById('finKpis').innerHTML='<div class="fin-lock">Financial details stay behind your private Mission Control sync. They are not stored in the public website code.</div>';return}
  const c=snap.currentMonth||{},y=snap.yearToDate||{},debt=snap.debt||{};lastFinanceStamp=snap.asOf||'';
  d.getElementById('finAsOf').textContent=`${c.label||'Current month'} • Private finance snapshot through ${dateLabel(snap.asOf)}`;
  const K=[[money(c.spending),'Month spending',`${money(c.remaining)} remaining`,c.remaining<0?'bad':''],[money(c.workingBudget),'Working budget',`${money(c.glp1Earmark)} GLP-1 earmark included`,''],[money(c.confirmedIncome),'Confirmed income',`Month margin ${signed(c.householdMargin)}`,c.householdMargin<0?'bad':'good'],[String(c.reviewItems||0),'Review items','Transactions needing a clean answer',c.reviewItems?'warn':'good'],[money(debt.connectedBalanceTotal),'Connected debt','Balances currently verified',debt.connectedBalanceTotal?'warn':'good'],[money(debt.knownMonthlyCommitments),'Known debt commitments','Minimum + recurring payment streams',''],[money(y.spending),'2026 YTD spending',`YTD margin ${signed(y.householdMargin)}`,y.householdMargin<0?'bad':'good'],[money(c.glp1Earmark),'Julie GLP-1','Protected monthly earmark','good']];
  d.getElementById('finKpis').innerHTML=K.map(x=>`<div class="fin-kpi ${x[3]||''}"><div class="n">${x[0]}</div><div class="l">${x[1]}</div><div class="d">${x[2]}</div></div>`).join('');
  renderBars(d.getElementById('finSpend'),snap.monthly||[],'spending','budget');renderBars(d.getElementById('finIncome'),snap.monthly||[],'confirmedIncome','spending');renderMargins(d.getElementById('finMargin'),snap.monthly||[]);
  const pressure=(snap.categories||[]).slice().sort((a,b)=>Number(a.variance)-Number(b.variance)),maxP=Math.max(1,...pressure.map(x=>Math.abs(Math.min(0,Number(x.variance)||0))));d.getElementById('finPressure').innerHTML=pressure.slice(0,8).map(x=>{const v=Number(x.variance)||0;return `<div class="fin-pressure-row"><div><b>${esc(x.name)}</b><div class="hint">YTD ${money(x.ytdActual)} • plan ${money(x.planned)}</div></div><div class="v">${v<0?money(Math.abs(v))+' over':money(v)+' under'}</div><div class="fin-meter"><span style="width:${v<0?Math.max(3,Math.abs(v)/maxP*100):0}%"></span></div></div>`}).join('');
  const accts=debt.accounts||[];d.getElementById('finDebt').innerHTML=`<div class="fin-debt-summary"><div class="fin-debt-stat"><b>${money(debt.connectedBalanceTotal)}</b><span>Connected balances</span></div><div class="fin-debt-stat"><b>${money(debt.knownMonthlyCommitments)}</b><span>Known monthly commitments</span></div><div class="fin-debt-stat"><b>${accts.filter(a=>a.apr==null).length}</b><span>Missing APR data</span></div></div><div class="fin-debt-grid">${accts.map(a=>`<div class="fin-debt-card ${a.balance==null?'missing':''}"><h4>${esc(a.name)}</h4><div class="hint">${esc(a.type)}</div><div class="fin-balance">${a.balance==null?'Balance unknown':money(a.balance)}</div><div class="fin-debt-meta">${esc(a.paymentLabel)}: <b>${money(a.payment)}</b><br>Next due: <b>${dateLabel(a.due)}</b><br>APR: <b>${a.apr==null?'Unknown':esc(a.apr)+'%'}</b></div><div class="fin-status">${esc(a.status)}</div></div>`).join('')}</div><div class="item" style="margin-top:9px"><b>Payoff priority is intentionally not guessed.</b><span>${esc(debt.priorityNote||'Missing APR or payoff balance data.')}</span></div>`;
  d.getElementById('finReview').innerHTML=(snap.reviewItems||[]).map(x=>`<div class="fin-review"><span>${dateLabel(x.date)}</span><b>${esc(x.description)}</b><span class="amount">${money(x.amount)}</span><span class="cat">${esc(x.category)}</span><span class="reason">${esc(x.reason)}</span></div>`).join('')||'<div class="item"><b>Nothing needs review.</b></div>';
  d.getElementById('finSource').innerHTML=`<b>Privacy:</b> Financial details are carried through your existing private Mission Control sync and are not embedded in the public GitHub Pages code.<br><b>Data rule:</b> ${esc(snap.sourceNote||'Missing balances and APRs remain unknown rather than estimated.')}`;
  if(showToast&&win().toast)win().toast('Finances refreshed');
}

frame.addEventListener('load',()=>{let tries=0;const ready=setInterval(()=>{tries++;if(installBridge()){clearInterval(ready);renderFinance();setTimeout(renderFinance,1500);setTimeout(renderFinance,4000);setInterval(()=>{const s=win().__mcFinanceSnapshot?win().__mcFinanceSnapshot():null;if(s&&s.asOf!==lastFinanceStamp)renderFinance()},5000)}else if(tries>40)clearInterval(ready)},100)});
</script>
</body>
</html>
