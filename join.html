<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Control — Join Household</title><link rel="stylesheet" href="/auth-ui.css"><style>body{margin:0;background:#07111f;color:#edf4fa;font-family:Inter,system-ui,sans-serif}.wrap{max-width:620px;margin:8vh auto;padding:24px}.card{background:#0d1a2c;border:1px solid #315174;border-radius:20px;padding:24px}button,input{font:inherit;padding:12px;border-radius:10px}input{width:min(100%,520px);box-sizing:border-box;margin:10px 0;background:#07111f;color:#edf4fa;border:1px solid #315174}.muted{color:#9eb0c5}.ok{color:#b8f2c8}</style><script src="/auth-ui.js" defer></script></head><body><div id="mcAuthGate"><div class="mc-auth-card"><h1>Mission Control</h1><p>Sign in with your own account before joining a household.</p><div id="mcClerkMount"></div><div class="mc-auth-state" id="mcAuthState">Loading secure sign-in…</div></div></div><div class="wrap"><div class="card"><h1>Join household</h1><p class="muted">Enter the single-use invitation code you received from the household principal.</p><input id="code" type="password" autocomplete="off" placeholder="Invitation code"><br><button id="claim">Join household</button><div id="out" class="muted"></div><p><a id="setupLink" href="/member-setup.html" hidden style="color:#a7d5ff">Continue to your setup</a></p></div></div><script>document.getElementById("claim").onclick=async()=>{const code=document.getElementById("code").value.trim(),out=document.getElementById("out");if(!code){out.textContent="Invitation code required.";return}out.textContent="Checking invitation…";const r=await fetch("/api/v1/claim-invitation",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({inviteToken:code})}),b=await r.json();if(!r.ok){out.textContent=b.error||"Invitation could not be claimed.";return}document.getElementById("code").value="";out.className="ok";out.textContent="Joined "+b.householdId+" as "+b.role+".";document.getElementById("setupLink").hidden=false;};</script></body></html>
